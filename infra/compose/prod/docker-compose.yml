name: edium-prod

services:
  caddy:
    image: caddy:2-alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      - /opt/edium/landing:/srv/landing:ro
    depends_on:
      - doorman
      - grafana
    networks:
      - edium

  doorman:
    image: cr.yandex/${YC_REGISTRY_ID}/edium-doorman:${IMAGE_TAG:-latest}
    restart: always
    environment:
      APP_PORT: "80"
      POSTGRES_DSN: "postgres://${DOORMAN_PG_USER}:${DOORMAN_PG_PWD}@${PG_HOST}:6432/${DOORMAN_PG_DB}?sslmode=require"
      REDIS_URL: "redis://:${DOORMAN_REDIS_PWD}@${REDIS_HOST}:6379/0"
      NATS_URL: "nats://doorman:${NATS_PASSWORD_DOORMAN}@nats:4222"
      JWT_RSA_PRIVATE_KEY: ${JWT_RSA_PRIVATE_KEY}
      JWT_ACTIVE_KID: ${JWT_ACTIVE_KID:-key-1}
      OTEL_ENDPOINT: "jaeger:4317"
    expose:
      - "80"
    depends_on:
      doorman-flyway:
        condition: service_completed_successfully
      nats:
        condition: service_started
      jaeger:
        condition: service_started
    deploy:
      resources:
        limits:
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - edium

  doorman-flyway:
    image: flyway/flyway:12.2.0
    restart: "no"
    command: ["migrate"]
    environment:
      FLYWAY_URL: "jdbc:postgresql://${PG_HOST}:6432/${DOORMAN_PG_DB}?sslmode=require"
      FLYWAY_USER: ${DOORMAN_PG_USER}
      FLYWAY_PASSWORD: ${DOORMAN_PG_PWD}
      FLYWAY_LOCATIONS: "filesystem:/app/migrations"
      FLYWAY_INIT_SQL: "SET search_path TO doorman, public;"
      FLYWAY_VALIDATE_MIGRATION_NAMING: "true"
      FLYWAY_BASELINE_ON_MIGRATE: "true"
    volumes:
      - ./migrations/doorman:/app/migrations
    networks:
      - edium

  herald:
    image: cr.yandex/${YC_REGISTRY_ID}/edium-herald:${IMAGE_TAG:-latest}
    restart: always
    environment:
      POSTGRES_DSN: "postgres://${HERALD_PG_USER}:${HERALD_PG_PWD}@${PG_HOST}:6432/${HERALD_PG_DB}?sslmode=require"
      NATS_URL: "nats://herald:${NATS_PASSWORD_HERALD}@nats:4222"
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      EMAIL_API_KEY: ${EMAIL_API_KEY:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_TLS_MODE: ${SMTP_TLS_MODE:-starttls}
      VK_GROUP_TOKEN: ${VK_GROUP_TOKEN}
      VK_GROUP_ID: ${VK_GROUP_ID}
      SMS_API_KEY: ${SMS_API_KEY}
      SMS_ALLOWED_PHONES: ${SMS_ALLOWED_PHONES}
      SMS_BLOCKED_PHONES: ${SMS_BLOCKED_PHONES}
      DOORMAN_JWKS_URL: "http://doorman/doorman/v1/.well-known/jwks.json"
      FIREBASE_CREDENTIALS_JSON: ${FIREBASE_CREDENTIALS_JSON}
      OTEL_ENDPOINT: "jaeger:4317"
    depends_on:
      herald-flyway:
        condition: service_completed_successfully
      nats:
        condition: service_started
      jaeger:
        condition: service_started
      doorman:
        condition: service_started
    deploy:
      resources:
        limits:
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - edium

  herald-flyway:
    image: flyway/flyway:12.2.0
    restart: "no"
    command: ["migrate"]
    environment:
      FLYWAY_URL: "jdbc:postgresql://${PG_HOST}:6432/${HERALD_PG_DB}?sslmode=require"
      FLYWAY_USER: ${HERALD_PG_USER}
      FLYWAY_PASSWORD: ${HERALD_PG_PWD}
      FLYWAY_LOCATIONS: "filesystem:/app/migrations"
      FLYWAY_VALIDATE_MIGRATION_NAMING: "true"
      FLYWAY_BASELINE_ON_MIGRATE: "true"
    volumes:
      - ./migrations/herald:/app/migrations
    networks:
      - edium

  charon:
    image: cr.yandex/${YC_REGISTRY_ID}/edium-charon:${IMAGE_TAG:-latest}
    restart: always
    environment:
      APP_PORT: "80"
      POSTGRES_DSN: "postgres://${CHARON_PG_USER}:${CHARON_PG_PWD}@${PG_HOST}:6432/${CHARON_PG_DB}?sslmode=require"
      REDIS_URL: "redis://:${CHARON_REDIS_PWD}@${REDIS_HOST}:6379/1"
      NATS_URL: "nats://charon:${NATS_PASSWORD_CHARON}@nats:4222"
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      CLICKHOUSE_DSN: "clickhouse://vector:${CLICKHOUSE_PASSWORD}@clickhouse:9000/logs"
      OTEL_ENDPOINT: "jaeger:4317"
    depends_on:
      charon-flyway:
        condition: service_completed_successfully
      nats:
        condition: service_started
      jaeger:
        condition: service_started
    deploy:
      resources:
        limits:
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - edium

  charon-flyway:
    image: flyway/flyway:12.2.0
    restart: "no"
    command: ["migrate"]
    environment:
      FLYWAY_URL: "jdbc:postgresql://${PG_HOST}:6432/${CHARON_PG_DB}?sslmode=require"
      FLYWAY_USER: ${CHARON_PG_USER}
      FLYWAY_PASSWORD: ${CHARON_PG_PWD}
      FLYWAY_LOCATIONS: "filesystem:/app/migrations"
      FLYWAY_VALIDATE_MIGRATION_NAMING: "true"
      FLYWAY_BASELINE_ON_MIGRATE: "true"
    volumes:
      - ./migrations/charon:/app/migrations
    networks:
      - edium

  caesar:
    image: cr.yandex/${YC_REGISTRY_ID}/edium-caesar:${IMAGE_TAG:-latest}
    restart: always
    environment:
      APP_PORT: "80"
      POSTGRES_DSN: "postgres://${CAESAR_PG_USER}:${CAESAR_PG_PWD}@${PG_HOST}:6432/${CAESAR_PG_DB}?sslmode=require"
      NATS_URL: "nats://caesar:${NATS_PASSWORD_CAESAR}@nats:4222"
      DOORMAN_JWKS_URL: "http://doorman/doorman/v1/.well-known/jwks.json"
      OTEL_ENDPOINT: "jaeger:4317"
    depends_on:
      caesar-flyway:
        condition: service_completed_successfully
      nats:
        condition: service_started
      jaeger:
        condition: service_started
    deploy:
      resources:
        limits:
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - edium

  caesar-flyway:
    image: flyway/flyway:12.2.0
    restart: "no"
    command: ["migrate"]
    environment:
      FLYWAY_URL: "jdbc:postgresql://${PG_HOST}:6432/${CAESAR_PG_DB}?sslmode=require"
      FLYWAY_USER: ${CAESAR_PG_USER}
      FLYWAY_PASSWORD: ${CAESAR_PG_PWD}
      FLYWAY_LOCATIONS: "filesystem:/app/migrations"
      FLYWAY_VALIDATE_MIGRATION_NAMING: "true"
      FLYWAY_BASELINE_ON_MIGRATE: "true"
    volumes:
      - ./migrations/caesar:/app/migrations
    networks:
      - edium

  riddler:
    image: cr.yandex/${YC_REGISTRY_ID}/edium-riddler:${IMAGE_TAG:-latest}
    restart: always
    environment:
      APP_PORT: "80"
      POSTGRES_DSN: "postgres://${RIDDLER_PG_USER}:${RIDDLER_PG_PWD}@${PG_HOST}:6432/${RIDDLER_PG_DB}?sslmode=require"
      REDIS_URL: "redis://:${RIDDLER_REDIS_PWD}@${REDIS_HOST}:6379/2"
      NATS_URL: "nats://riddler:${NATS_PASSWORD_RIDDLER}@nats:4222"
      DOORMAN_JWKS_URL: "http://doorman/doorman/v1/.well-known/jwks.json"
      OTEL_ENDPOINT: "jaeger:4317"
    depends_on:
      riddler-flyway:
        condition: service_completed_successfully
      nats:
        condition: service_started
      jaeger:
        condition: service_started
    deploy:
      resources:
        limits:
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - edium

  riddler-flyway:
    image: flyway/flyway:12.2.0
    restart: "no"
    command: ["migrate"]
    environment:
      FLYWAY_URL: "jdbc:postgresql://${PG_HOST}:6432/${RIDDLER_PG_DB}?sslmode=require"
      FLYWAY_USER: ${RIDDLER_PG_USER}
      FLYWAY_PASSWORD: ${RIDDLER_PG_PWD}
      FLYWAY_LOCATIONS: "filesystem:/app/migrations"
      FLYWAY_VALIDATE_MIGRATION_NAMING: "true"
      FLYWAY_BASELINE_ON_MIGRATE: "true"
    volumes:
      - ./migrations/riddler:/app/migrations
    networks:
      - edium

  louvre:
    image: cr.yandex/${YC_REGISTRY_ID}/edium-louvre:${IMAGE_TAG:-latest}
    restart: always
    environment:
      APP_PORT: "80"
      POSTGRES_DSN: "postgres://${LOUVRE_PG_USER}:${LOUVRE_PG_PWD}@${PG_HOST}:6432/${LOUVRE_PG_DB}?sslmode=require"
      MINIO_ENDPOINT: ${LOUVRE_MINIO_ENDPOINT}
      MINIO_ROOT_USER: ${LOUVRE_MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${LOUVRE_MINIO_SECRET_KEY}
      MINIO_BUCKET: ${LOUVRE_MINIO_BUCKET:-edium-images}
      MINIO_USE_SSL: ${LOUVRE_MINIO_USE_SSL:-false}
      DOORMAN_JWKS_URL: "http://doorman/doorman/v1/.well-known/jwks.json"
      OTEL_ENDPOINT: "jaeger:4317"
    depends_on:
      louvre-flyway:
        condition: service_completed_successfully
      doorman:
        condition: service_started
      jaeger:
        condition: service_started
    deploy:
      resources:
        limits:
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - edium

  louvre-flyway:
    image: flyway/flyway:12.2.0
    restart: "no"
    command: ["migrate"]
    environment:
      FLYWAY_URL: "jdbc:postgresql://${PG_HOST}:6432/${LOUVRE_PG_DB}?sslmode=require"
      FLYWAY_USER: ${LOUVRE_PG_USER}
      FLYWAY_PASSWORD: ${LOUVRE_PG_PWD}
      FLYWAY_LOCATIONS: "filesystem:/app/migrations"
      FLYWAY_VALIDATE_MIGRATION_NAMING: "true"
      FLYWAY_BASELINE_ON_MIGRATE: "true"
    volumes:
      - ./migrations/louvre:/app/migrations
    networks:
      - edium

  node-exporter:
    image: prom/node-exporter:latest
    restart: always
    pid: host
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--path.rootfs=/rootfs"
    deploy:
      resources:
        limits:
          memory: 64M
    networks:
      - edium

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    restart: always
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    deploy:
      resources:
        limits:
          memory: 256M
    networks:
      - edium

  nats:
    image: nats:2.10
    restart: always
    command: ["-c", "/etc/nats/nats-server.conf"]
    environment:
      NATS_PASSWORD_DOORMAN: ${NATS_PASSWORD_DOORMAN}
      NATS_PASSWORD_HERALD: ${NATS_PASSWORD_HERALD}
      NATS_PASSWORD_CAESAR: ${NATS_PASSWORD_CAESAR}
      NATS_PASSWORD_CHARON: ${NATS_PASSWORD_CHARON}
      NATS_PASSWORD_RIDDLER: ${NATS_PASSWORD_RIDDLER}
      NATS_PASSWORD_SPHINX: ${NATS_PASSWORD_SPHINX}
    volumes:
      - nats_data:/data
      - ./nats/nats-server.conf:/etc/nats/nats-server.conf:ro
    networks:
      - edium

  # stunnel — TLS-прокси для внешних подключений Sphinx (другой YC аккаунт)
  # Sphinx подключается: nats://sphinx:pass@<VM_PUBLIC_IP>:4223
  # Генерация сертификата: ./nats/gen-cert.sh
  nats-stunnel:
    image: dweomer/stunnel:latest
    restart: always
    ports:
      - "4223:4223"
    environment:
      STUNNEL_SERVICE: nats
      STUNNEL_ACCEPT: "4223"
      STUNNEL_CONNECT: "nats:4222"
      STUNNEL_CRT: /tls/tls.crt
      STUNNEL_KEY: /tls/tls.key
    volumes:
      - ./nats:/tls:ro
    depends_on:
      - nats
    deploy:
      resources:
        limits:
          memory: 32M
    networks:
      - edium

  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    restart: always
    environment:
      CLICKHOUSE_USER: vector
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      CLICKHOUSE_DB: logs
    volumes:
      - ./clickhouse/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - clickhouse_data:/var/lib/clickhouse
    deploy:
      resources:
        limits:
          memory: 1G
    networks:
      - edium

  vector:
    image: timberio/vector:0.42.0-alpine
    restart: always
    volumes:
      - ./vector.yaml:/etc/vector/vector.yaml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
    depends_on:
      - clickhouse
    networks:
      - edium

  jaeger:
    image: jaegertracing/all-in-one:1.68.0
    restart: always
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    expose:
      - "16686"
      - "4317"
    deploy:
      resources:
        limits:
          memory: 256M
    networks:
      - edium

  prometheus:
    image: prom/prometheus:v3.3.0
    restart: always
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    expose:
      - "9090"
    deploy:
      resources:
        limits:
          memory: 256M
    networks:
      - edium

  alertmanager:
    image: prom/alertmanager:v0.27.0
    restart: always
    command: ["--config.file=/etc/alertmanager/alertmanager.yml", "--storage.path=/alertmanager"]
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    expose:
      - "9093"
    depends_on:
      - prometheus
    deploy:
      resources:
        limits:
          memory: 64M
    networks:
      - edium

  grafana:
    image: grafana/grafana:11.4.0
    restart: always
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD}
      GF_INSTALL_PLUGINS: grafana-clickhouse-datasource
      GRAFANA_CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
    volumes:
      - ./grafana/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/provisioning:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    expose:
      - "3000"
    depends_on:
      - clickhouse
      - jaeger
      - prometheus
    deploy:
      resources:
        limits:
          memory: 256M
    networks:
      - edium

volumes:
  caddy_data:
  caddy_config:
  nats_data:
  clickhouse_data:
  grafana_data:
  prometheus_data:
  alertmanager_data:

networks:
  edium:
    driver: bridge
