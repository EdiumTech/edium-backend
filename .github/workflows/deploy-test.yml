name: Deploy Test

on:
  push:
    branches: [main]
    paths:
      - "doorman/**"
      - "herald/**"
      - "charon/**"
      - "caesar/**"
      - "riddler/**"
      - "louvre/**"
      - "infra/compose/test/**"
      - "infra/compose/prod/nats/**"
      - "infra/grafana/**"
      - "infra/alertmanager/**"
      - "infra/prometheus/**"
      - "infra/terraform/modules/**"
      - "infra/terraform/accounts/platform/**"
      - "e2e/**"
  workflow_dispatch:

permissions:
  contents: read

env:
  REGISTRY: cr.yandex/${{ secrets.YC_REGISTRY_ID }}
  TF_VERSION: "1.9"
  YC_MIRROR: "https://terraform-mirror.yandexcloud.net/"

jobs:
  # ========================
  # Определение изменений (только при push)
  # ========================

  detect-changes:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      doorman: ${{ steps.filter.outputs.doorman }}
      herald: ${{ steps.filter.outputs.herald }}
      charon: ${{ steps.filter.outputs.charon }}
      caesar: ${{ steps.filter.outputs.caesar }}
      riddler: ${{ steps.filter.outputs.riddler }}
      louvre: ${{ steps.filter.outputs.louvre }}
      terraform_platform: ${{ steps.filter.outputs.terraform_platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            doorman:
              - 'doorman/**'
            herald:
              - 'herald/**'
            charon:
              - 'charon/**'
            caesar:
              - 'caesar/**'
            riddler:
              - 'riddler/**'
            louvre:
              - 'louvre/**'
              - 'infra/compose/test/docker-compose.yml'
              - 'infra/compose/prod/docker-compose.yml'
            terraform_platform:
              - 'infra/terraform/modules/**'
              - 'infra/terraform/accounts/platform/**'

  # ========================
  # Terraform — Platform
  # ========================

  terraform-plan:
    needs: [detect-changes]
    if: needs.detect-changes.outputs.terraform_platform == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform/accounts/platform
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Настройка YC провайдера
        run: |
          cat > ~/.terraformrc <<'EOF'
          provider_installation {
            network_mirror {
              url = "${{ env.YC_MIRROR }}"
              include = ["registry.terraform.io/*/*"]
            }
            direct {
              exclude = ["registry.terraform.io/*/*"]
            }
          }
          EOF
          echo '${{ secrets.YC_SA_KEY_JSON }}' > key.json
          echo '${{ secrets.TF_VARS_PLATFORM }}' > terraform.tfvars

      - name: Terraform init
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.TF_S3_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.TF_S3_SECRET_KEY }}
        run: terraform init

      - name: Terraform plan
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.TF_S3_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.TF_S3_SECRET_KEY }}
        run: terraform plan -no-color -out=tfplan

      - name: Сохранение плана
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-platform
          path: infra/terraform/accounts/platform/tfplan
          retention-days: 1

      - name: Очистка
        if: always()
        run: rm -f key.json terraform.tfvars

  terraform-apply:
    needs: [terraform-plan]
    if: always() && needs.terraform-plan.result == 'success'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform/accounts/platform
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Настройка YC провайдера
        run: |
          cat > ~/.terraformrc <<'EOF'
          provider_installation {
            network_mirror {
              url = "${{ env.YC_MIRROR }}"
              include = ["registry.terraform.io/*/*"]
            }
            direct {
              exclude = ["registry.terraform.io/*/*"]
            }
          }
          EOF
          echo '${{ secrets.YC_SA_KEY_JSON }}' > key.json
          echo '${{ secrets.TF_VARS_PLATFORM }}' > terraform.tfvars

      - name: Terraform init
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.TF_S3_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.TF_S3_SECRET_KEY }}
        run: terraform init

      - name: Загрузка плана
        uses: actions/download-artifact@v4
        with:
          name: tfplan-platform
          path: infra/terraform/accounts/platform

      - name: Terraform apply
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.TF_S3_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.TF_S3_SECRET_KEY }}
        run: terraform apply -auto-approve tfplan

      - name: Очистка
        if: always()
        run: rm -f key.json terraform.tfvars tfplan

  # ========================
  # Build и push образов
  # ========================

  build-doorman:
    needs: [detect-changes]
    if: needs.detect-changes.outputs.doorman == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Авторизация в Container Registry
        run: echo '${{ secrets.YC_SA_KEY_JSON }}' | docker login --username json_key --password-stdin cr.yandex
      - name: Build и push
        run: |
          IMAGE=${{ env.REGISTRY }}/edium-doorman
          TAG=main-${GITHUB_SHA::7}
          docker build -t ${IMAGE}:${TAG} doorman/
          docker push ${IMAGE}:${TAG}
          docker tag ${IMAGE}:${TAG} ${IMAGE}:latest
          docker push ${IMAGE}:latest
          echo "Образ: ${IMAGE}:${TAG}" >> $GITHUB_STEP_SUMMARY

  build-herald:
    needs: [detect-changes]
    if: needs.detect-changes.outputs.herald == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Авторизация в Container Registry
        run: echo '${{ secrets.YC_SA_KEY_JSON }}' | docker login --username json_key --password-stdin cr.yandex
      - name: Build и push
        run: |
          IMAGE=${{ env.REGISTRY }}/edium-herald
          TAG=main-${GITHUB_SHA::7}
          docker build -t ${IMAGE}:${TAG} herald/
          docker push ${IMAGE}:${TAG}
          docker tag ${IMAGE}:${TAG} ${IMAGE}:latest
          docker push ${IMAGE}:latest
          echo "Образ: ${IMAGE}:${TAG}" >> $GITHUB_STEP_SUMMARY

  build-charon:
    needs: [detect-changes]
    if: needs.detect-changes.outputs.charon == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Авторизация в Container Registry
        run: echo '${{ secrets.YC_SA_KEY_JSON }}' | docker login --username json_key --password-stdin cr.yandex
      - name: Build и push
        run: |
          IMAGE=${{ env.REGISTRY }}/edium-charon
          TAG=main-${GITHUB_SHA::7}
          docker build -t ${IMAGE}:${TAG} charon/
          docker push ${IMAGE}:${TAG}
          docker tag ${IMAGE}:${TAG} ${IMAGE}:latest
          docker push ${IMAGE}:latest
          echo "Образ: ${IMAGE}:${TAG}" >> $GITHUB_STEP_SUMMARY

  build-caesar:
    needs: [detect-changes]
    if: needs.detect-changes.outputs.caesar == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Авторизация в Container Registry
        run: echo '${{ secrets.YC_SA_KEY_JSON }}' | docker login --username json_key --password-stdin cr.yandex
      - name: Build и push
        run: |
          IMAGE=${{ env.REGISTRY }}/edium-caesar
          TAG=main-${GITHUB_SHA::7}
          docker build -t ${IMAGE}:${TAG} caesar/
          docker push ${IMAGE}:${TAG}
          docker tag ${IMAGE}:${TAG} ${IMAGE}:latest
          docker push ${IMAGE}:latest
          echo "Образ: ${IMAGE}:${TAG}" >> $GITHUB_STEP_SUMMARY

  build-riddler:
    needs: [detect-changes]
    if: needs.detect-changes.outputs.riddler == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Авторизация в Container Registry
        run: echo '${{ secrets.YC_SA_KEY_JSON }}' | docker login --username json_key --password-stdin cr.yandex
      - name: Build и push
        run: |
          IMAGE=${{ env.REGISTRY }}/edium-riddler
          TAG=main-${GITHUB_SHA::7}
          docker build -t ${IMAGE}:${TAG} riddler/
          docker push ${IMAGE}:${TAG}
          docker tag ${IMAGE}:${TAG} ${IMAGE}:latest
          docker push ${IMAGE}:latest
          echo "Образ: ${IMAGE}:${TAG}" >> $GITHUB_STEP_SUMMARY

  build-louvre:
    needs: [detect-changes]
    if: needs.detect-changes.outputs.louvre == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Авторизация в Container Registry
        run: echo '${{ secrets.YC_SA_KEY_JSON }}' | docker login --username json_key --password-stdin cr.yandex
      - name: Build и push
        run: |
          IMAGE=${{ env.REGISTRY }}/edium-louvre
          TAG=main-${GITHUB_SHA::7}
          docker build -t ${IMAGE}:${TAG} louvre/
          docker push ${IMAGE}:${TAG}
          docker tag ${IMAGE}:${TAG} ${IMAGE}:latest
          docker push ${IMAGE}:latest
          echo "Образ: ${IMAGE}:${TAG}" >> $GITHUB_STEP_SUMMARY

  # ========================
  # Deploy на test VM
  # ========================

  deploy-test:
    needs:
      - build-doorman
      - build-herald
      - build-charon
      - build-caesar
      - build-riddler
      - build-louvre
      - terraform-apply
    if: |
      always() &&
      (needs.build-doorman.result   == 'success' || needs.build-doorman.result   == 'skipped') &&
      (needs.build-herald.result    == 'success' || needs.build-herald.result    == 'skipped') &&
      (needs.build-charon.result    == 'success' || needs.build-charon.result    == 'skipped') &&
      (needs.build-caesar.result    == 'success' || needs.build-caesar.result    == 'skipped') &&
      (needs.build-riddler.result   == 'success' || needs.build-riddler.result   == 'skipped') &&
      (needs.build-louvre.result    == 'success' || needs.build-louvre.result    == 'skipped') &&
      (needs.terraform-apply.result == 'success' || needs.terraform-apply.result == 'skipped')
    runs-on: ubuntu-latest
    environment: test
    steps:
      - uses: actions/checkout@v4

      - name: Копирование файлов на сервер
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.TEST_VM_HOST }}
          username: deploy
          key: ${{ secrets.TEST_VM_SSH_KEY }}
          source: "infra/compose/test/docker-compose.yml,infra/compose/test/Caddyfile,infra/compose/test/vector.yaml,infra/compose/test/prometheus.yml,infra/compose/test/clickhouse/,infra/compose/prod/nats/nats-server.conf,infra/grafana/,infra/alertmanager/,infra/prometheus/,doorman/migrations/,herald/migrations/,charon/migrations/,caesar/migrations/,riddler/migrations/,louvre/migrations/"
          target: /tmp/edium-deploy/
          strip_components: 0

      - name: Deploy
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.TEST_VM_HOST }}
          username: deploy
          key: ${{ secrets.TEST_VM_SSH_KEY }}
          script: |
            set -e

            cp /tmp/edium-deploy/infra/compose/test/docker-compose.yml /opt/edium/docker-compose.yml
            cp /tmp/edium-deploy/infra/compose/test/Caddyfile /opt/edium/Caddyfile
            cp /tmp/edium-deploy/infra/compose/test/vector.yaml /opt/edium/vector.yaml
            cp /tmp/edium-deploy/infra/compose/test/prometheus.yml /opt/edium/prometheus.yml
            mkdir -p /opt/edium/clickhouse
            cp /tmp/edium-deploy/infra/compose/test/clickhouse/init.sql /opt/edium/clickhouse/init.sql
            cp /tmp/edium-deploy/infra/compose/test/clickhouse/migrate.sql /opt/edium/clickhouse/migrate.sql
            mkdir -p /opt/edium/grafana/datasources /opt/edium/grafana/provisioning /opt/edium/grafana/dashboards
            rm -rf /opt/edium/grafana/provisioning/dashboards.yaml
            cp -r /tmp/edium-deploy/infra/grafana/. /opt/edium/grafana/
            mkdir -p /opt/edium/alertmanager
            cp /tmp/edium-deploy/infra/alertmanager/alertmanager.yml /opt/edium/alertmanager/alertmanager.yml
            mkdir -p /opt/edium/prometheus
            cp /tmp/edium-deploy/infra/prometheus/alerts.yml /opt/edium/prometheus/alerts.yml
            mkdir -p /opt/edium/migrations/doorman /opt/edium/migrations/herald /opt/edium/migrations/charon /opt/edium/migrations/caesar /opt/edium/migrations/riddler /opt/edium/migrations/louvre
            for svc in doorman herald charon caesar riddler louvre; do
              find "/opt/edium/migrations/$svc" -mindepth 1 -delete
              cp -r "/tmp/edium-deploy/$svc/migrations/." "/opt/edium/migrations/$svc/"
            done
            mkdir -p /opt/edium/nats
            cp /tmp/edium-deploy/infra/compose/prod/nats/nats-server.conf /opt/edium/nats/nats-server.conf

            cd /opt/edium

            cat > .env <<'ENVEOF'
            YC_REGISTRY_ID=${{ secrets.YC_REGISTRY_ID }}
            DOORMAN_PG_USER=${{ secrets.DOORMAN_PG_USER }}
            DOORMAN_PG_PWD=${{ secrets.DOORMAN_PG_PWD }}
            DOORMAN_PG_DB=${{ secrets.DOORMAN_PG_DB }}
            PG_HOST=${{ secrets.PG_HOST }}
            DOORMAN_REDIS_PWD=${{ secrets.DOORMAN_REDIS_PWD }}
            REDIS_HOST=${{ secrets.REDIS_HOST }}
            JWT_ACTIVE_KID=${{ secrets.JWT_ACTIVE_KID }}
            HERALD_PG_USER=${{ secrets.HERALD_PG_USER }}
            HERALD_PG_PWD=${{ secrets.HERALD_PG_PWD }}
            HERALD_PG_DB=${{ secrets.HERALD_PG_DB }}
            TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }}
            EMAIL_API_KEY='${{ secrets.EMAIL_API_KEY }}'
            SMTP_HOST='${{ secrets.SMTP_HOST }}'
            SMTP_PORT=${{ secrets.SMTP_PORT }}
            SMTP_USERNAME='${{ secrets.SMTP_USERNAME }}'
            SMTP_PASSWORD='${{ secrets.SMTP_PASSWORD }}'
            SMTP_FROM='${{ secrets.SMTP_FROM }}'
            SMTP_TLS_MODE=${{ secrets.SMTP_TLS_MODE }}
            VK_GROUP_TOKEN=${{ secrets.VK_GROUP_TOKEN }}
            VK_GROUP_ID=${{ secrets.VK_GROUP_ID }}
            SMS_API_KEY=${{ secrets.SMS_API_KEY }}
            SMS_ALLOWED_PHONES=${{ secrets.SMS_ALLOWED_PHONES }}
            CAESAR_PG_USER=${{ secrets.CAESAR_PG_USER }}
            CAESAR_PG_PWD=${{ secrets.CAESAR_PG_PWD }}
            CAESAR_PG_DB=${{ secrets.CAESAR_PG_DB }}
            RIDDLER_PG_USER=${{ secrets.RIDDLER_PG_USER }}
            RIDDLER_PG_PWD=${{ secrets.RIDDLER_PG_PWD }}
            RIDDLER_PG_DB=${{ secrets.RIDDLER_PG_DB }}
            RIDDLER_REDIS_PWD=${{ secrets.RIDDLER_REDIS_PWD }}
            LOUVRE_PG_USER=${{ secrets.LOUVRE_PG_USER }}
            LOUVRE_PG_PWD=${{ secrets.LOUVRE_PG_PWD }}
            LOUVRE_PG_DB=${{ secrets.LOUVRE_PG_DB }}
            LOUVRE_MINIO_ENDPOINT=${{ secrets.LOUVRE_MINIO_ENDPOINT }}
            LOUVRE_MINIO_ACCESS_KEY=${{ secrets.LOUVRE_MINIO_ACCESS_KEY }}
            LOUVRE_MINIO_SECRET_KEY=${{ secrets.LOUVRE_MINIO_SECRET_KEY }}
            LOUVRE_MINIO_BUCKET=${{ secrets.LOUVRE_MINIO_BUCKET }}
            LOUVRE_MINIO_USE_SSL=${{ secrets.LOUVRE_MINIO_USE_SSL }}
            CHARON_PG_USER=${{ secrets.CHARON_PG_USER }}
            CHARON_PG_PWD=${{ secrets.CHARON_PG_PWD }}
            CHARON_PG_DB=${{ secrets.CHARON_PG_DB }}
            CHARON_REDIS_PWD=${{ secrets.CHARON_REDIS_PWD }}
            DEEPSEEK_API_KEY=${{ secrets.DEEPSEEK_API_KEY }}
            DEEPSEEK_BASE_URL=${{ secrets.DEEPSEEK_BASE_URL }}
            CLICKHOUSE_PASSWORD=${{ secrets.CLICKHOUSE_PASSWORD }}
            GRAFANA_PASSWORD=${{ secrets.GRAFANA_PASSWORD }}
            GRAFANA_CLICKHOUSE_PASSWORD=${{ secrets.CLICKHOUSE_PASSWORD }}
            NATS_PASSWORD_DOORMAN=${{ secrets.NATS_PASSWORD_DOORMAN }}
            NATS_PASSWORD_HERALD=${{ secrets.NATS_PASSWORD_HERALD }}
            NATS_PASSWORD_CAESAR=${{ secrets.NATS_PASSWORD_CAESAR }}
            NATS_PASSWORD_CHARON=${{ secrets.NATS_PASSWORD_CHARON }}
            NATS_PASSWORD_RIDDLER=${{ secrets.NATS_PASSWORD_RIDDLER }}
            NATS_PASSWORD_SPHINX=${{ secrets.NATS_PASSWORD_SPHINX }}
            ALERTMANAGER_TG_TOKEN=${{ secrets.ALERTMANAGER_TG_TOKEN }}
            ALERTMANAGER_TG_CHAT_ID=${{ secrets.ALERTMANAGER_TG_CHAT_ID }}
            JAEGER_BASIC_AUTH_HASH=${{ secrets.JAEGER_BASIC_AUTH_HASH }}
            FIREBASE_CREDENTIALS_JSON=${{ secrets.FIREBASE_CREDENTIALS_JSON }}
            ENVEOF
            sed -i 's/^[[:space:]]*//' .env

            printf 'JWT_RSA_PRIVATE_KEY=' >> .env
            printf '%s' '${{ secrets.JWT_RSA_PRIVATE_KEY }}' | awk 'NR>1{printf "\\n"}{printf "%s",$0}' >> .env
            echo >> .env

            export $(grep -E '^NATS_PASSWORD_' .env | xargs)
            envsubst '$NATS_PASSWORD_DOORMAN $NATS_PASSWORD_HERALD $NATS_PASSWORD_CAESAR $NATS_PASSWORD_CHARON $NATS_PASSWORD_RIDDLER $NATS_PASSWORD_SPHINX' \
              < /opt/edium/nats/nats-server.conf > /tmp/nats-expanded.conf
            mv /tmp/nats-expanded.conf /opt/edium/nats/nats-server.conf

            export $(grep -E '^ALERTMANAGER_' .env | xargs)
            envsubst '$ALERTMANAGER_TG_TOKEN $ALERTMANAGER_TG_CHAT_ID' \
              < /opt/edium/alertmanager/alertmanager.yml > /tmp/alertmanager-expanded.yml
            mv /tmp/alertmanager-expanded.yml /opt/edium/alertmanager/alertmanager.yml

            export JAEGER_BASIC_AUTH_HASH="$(grep '^JAEGER_BASIC_AUTH_HASH=' .env | cut -d= -f2-)"
            envsubst '$JAEGER_BASIC_AUTH_HASH' \
              < /opt/edium/Caddyfile > /tmp/Caddyfile-expanded
            mv /tmp/Caddyfile-expanded /opt/edium/Caddyfile

            echo '${{ secrets.YC_SA_KEY_JSON }}' | docker login --username json_key --password-stdin cr.yandex

            docker compose pull
            docker compose up -d nats
            docker compose restart nats
            for i in $(seq 1 15); do nc -z 127.0.0.1 4222 2>/dev/null && break; sleep 1; done
            docker compose up -d --remove-orphans
            docker compose restart grafana vector caddy alertmanager
            docker image prune -f

            for i in $(seq 1 30); do
              docker compose exec -T clickhouse clickhouse-client \
                --user vector --password "${{ secrets.CLICKHOUSE_PASSWORD }}" \
                --query "SELECT 1" > /dev/null 2>&1 && break
              sleep 2
            done

            docker compose exec -T clickhouse clickhouse-client \
              --user vector --password "${{ secrets.CLICKHOUSE_PASSWORD }}" \
              --database logs --multiquery < /opt/edium/clickhouse/init.sql

            docker compose exec -T clickhouse clickhouse-client \
              --user vector --password "${{ secrets.CLICKHOUSE_PASSWORD }}" \
              --database logs --multiquery < /opt/edium/clickhouse/migrate.sql

            rm -rf /tmp/edium-deploy
            echo "Deploy завершён"

  # ========================
  # E2E smoke tests (параллельно по сервисам)
  # ========================

  e2e-doorman:
    needs: [deploy-test]
    if: always() && needs.deploy-test.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Smoke tests — Doorman
        run: bash e2e/smoke.sh https://test.edium.online doorman

  e2e-caesar:
    needs: [deploy-test]
    if: always() && needs.deploy-test.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Smoke tests — Caesar
        run: bash e2e/smoke.sh https://test.edium.online caesar

  e2e-riddler:
    needs: [deploy-test]
    if: always() && needs.deploy-test.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Smoke tests — Riddler
        run: bash e2e/smoke.sh https://test.edium.online riddler

  e2e-louvre:
    needs: [deploy-test]
    if: always() && needs.deploy-test.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Smoke tests — Louvre
        run: bash e2e/smoke.sh https://test.edium.online louvre

  e2e-herald:
    needs: [deploy-test]
    if: always() && needs.deploy-test.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Smoke tests — Herald
        run: bash e2e/smoke.sh https://test.edium.online herald

  # ========================
  # Deploy на prod VM (требует подтверждения)
  # ========================

  deploy-prod:
    needs: [e2e-doorman, e2e-caesar, e2e-riddler, e2e-louvre, e2e-herald]
    if: |
      always() &&
      needs.e2e-doorman.result == 'success' &&
      needs.e2e-caesar.result  == 'success' &&
      needs.e2e-riddler.result == 'success' &&
      needs.e2e-louvre.result  == 'success' &&
      needs.e2e-herald.result  == 'success'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Проверка образа
        run: |
          echo '${{ secrets.YC_SA_KEY_JSON }}' | docker login --username json_key --password-stdin cr.yandex
          docker manifest inspect ${{ env.REGISTRY }}/edium-doorman:latest
          echo "Образ существует: edium-doorman:latest" >> $GITHUB_STEP_SUMMARY

      - name: Копирование файлов на сервер
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.PROD_VM_HOST }}
          username: deploy
          key: ${{ secrets.PROD_VM_SSH_KEY }}
          source: "infra/compose/prod/docker-compose.yml,infra/compose/prod/Caddyfile,infra/compose/prod/vector.yaml,infra/compose/prod/prometheus.yml,infra/compose/prod/clickhouse/,infra/compose/prod/nats/nats-server.conf,infra/grafana/,infra/alertmanager/,infra/prometheus/,doorman/migrations/,herald/migrations/,charon/migrations/,caesar/migrations/,riddler/migrations/,louvre/migrations/"
          target: /tmp/edium-deploy/
          strip_components: 0

      - name: Deploy
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.PROD_VM_HOST }}
          username: deploy
          key: ${{ secrets.PROD_VM_SSH_KEY }}
          script: |
            set -e

            cp /tmp/edium-deploy/infra/compose/prod/docker-compose.yml /opt/edium/docker-compose.yml
            cp /tmp/edium-deploy/infra/compose/prod/Caddyfile /opt/edium/Caddyfile
            cp /tmp/edium-deploy/infra/compose/prod/vector.yaml /opt/edium/vector.yaml
            cp /tmp/edium-deploy/infra/compose/prod/prometheus.yml /opt/edium/prometheus.yml
            mkdir -p /opt/edium/clickhouse
            cp /tmp/edium-deploy/infra/compose/prod/clickhouse/init.sql /opt/edium/clickhouse/init.sql
            cp /tmp/edium-deploy/infra/compose/prod/clickhouse/migrate.sql /opt/edium/clickhouse/migrate.sql
            mkdir -p /opt/edium/grafana/datasources /opt/edium/grafana/provisioning /opt/edium/grafana/dashboards
            rm -rf /opt/edium/grafana/provisioning/dashboards.yaml
            cp -r /tmp/edium-deploy/infra/grafana/. /opt/edium/grafana/
            mkdir -p /opt/edium/alertmanager
            cp /tmp/edium-deploy/infra/alertmanager/alertmanager.yml /opt/edium/alertmanager/alertmanager.yml
            mkdir -p /opt/edium/prometheus
            cp /tmp/edium-deploy/infra/prometheus/alerts.yml /opt/edium/prometheus/alerts.yml
            mkdir -p /opt/edium/migrations/doorman /opt/edium/migrations/herald /opt/edium/migrations/charon /opt/edium/migrations/caesar /opt/edium/migrations/riddler /opt/edium/migrations/louvre
            for svc in doorman herald charon caesar riddler louvre; do
              find "/opt/edium/migrations/$svc" -mindepth 1 -delete
              cp -r "/tmp/edium-deploy/$svc/migrations/." "/opt/edium/migrations/$svc/"
            done
            mkdir -p /opt/edium/nats
            cp /tmp/edium-deploy/infra/compose/prod/nats/nats-server.conf /opt/edium/nats/nats-server.conf

            cd /opt/edium

            cat > .env <<'ENVEOF'
            YC_REGISTRY_ID=${{ secrets.YC_REGISTRY_ID }}
            IMAGE_TAG=latest
            DOORMAN_PG_USER=${{ secrets.DOORMAN_PG_USER }}
            DOORMAN_PG_PWD=${{ secrets.DOORMAN_PG_PWD }}
            DOORMAN_PG_DB=${{ secrets.DOORMAN_PG_DB }}
            PG_HOST=${{ secrets.PG_HOST }}
            DOORMAN_REDIS_PWD=${{ secrets.DOORMAN_REDIS_PWD }}
            REDIS_HOST=${{ secrets.REDIS_HOST }}
            JWT_ACTIVE_KID=${{ secrets.JWT_ACTIVE_KID }}
            HERALD_PG_USER=${{ secrets.HERALD_PG_USER }}
            HERALD_PG_PWD=${{ secrets.HERALD_PG_PWD }}
            HERALD_PG_DB=${{ secrets.HERALD_PG_DB }}
            TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }}
            EMAIL_API_KEY='${{ secrets.EMAIL_API_KEY }}'
            SMTP_HOST='${{ secrets.SMTP_HOST }}'
            SMTP_PORT=${{ secrets.SMTP_PORT }}
            SMTP_USERNAME='${{ secrets.SMTP_USERNAME }}'
            SMTP_PASSWORD='${{ secrets.SMTP_PASSWORD }}'
            SMTP_FROM='${{ secrets.SMTP_FROM }}'
            SMTP_TLS_MODE=${{ secrets.SMTP_TLS_MODE }}
            VK_GROUP_TOKEN=${{ secrets.VK_GROUP_TOKEN }}
            VK_GROUP_ID=${{ secrets.VK_GROUP_ID }}
            SMS_API_KEY=${{ secrets.SMS_API_KEY }}
            SMS_ALLOWED_PHONES=${{ secrets.SMS_ALLOWED_PHONES }}
            CAESAR_PG_USER=${{ secrets.CAESAR_PG_USER }}
            CAESAR_PG_PWD=${{ secrets.CAESAR_PG_PWD }}
            CAESAR_PG_DB=${{ secrets.CAESAR_PG_DB }}
            RIDDLER_PG_USER=${{ secrets.RIDDLER_PG_USER }}
            RIDDLER_PG_PWD=${{ secrets.RIDDLER_PG_PWD }}
            RIDDLER_PG_DB=${{ secrets.RIDDLER_PG_DB }}
            RIDDLER_REDIS_PWD=${{ secrets.RIDDLER_REDIS_PWD }}
            LOUVRE_PG_USER=${{ secrets.LOUVRE_PG_USER }}
            LOUVRE_PG_PWD=${{ secrets.LOUVRE_PG_PWD }}
            LOUVRE_PG_DB=${{ secrets.LOUVRE_PG_DB }}
            LOUVRE_MINIO_ENDPOINT=${{ secrets.LOUVRE_MINIO_ENDPOINT }}
            LOUVRE_MINIO_ACCESS_KEY=${{ secrets.LOUVRE_MINIO_ACCESS_KEY }}
            LOUVRE_MINIO_SECRET_KEY=${{ secrets.LOUVRE_MINIO_SECRET_KEY }}
            LOUVRE_MINIO_BUCKET=${{ secrets.LOUVRE_MINIO_BUCKET }}
            LOUVRE_MINIO_USE_SSL=${{ secrets.LOUVRE_MINIO_USE_SSL }}
            CHARON_PG_USER=${{ secrets.CHARON_PG_USER }}
            CHARON_PG_PWD=${{ secrets.CHARON_PG_PWD }}
            CHARON_PG_DB=${{ secrets.CHARON_PG_DB }}
            CHARON_REDIS_PWD=${{ secrets.CHARON_REDIS_PWD }}
            DEEPSEEK_API_KEY=${{ secrets.DEEPSEEK_API_KEY }}
            DEEPSEEK_BASE_URL=${{ secrets.DEEPSEEK_BASE_URL }}
            CLICKHOUSE_PASSWORD=${{ secrets.CLICKHOUSE_PASSWORD }}
            GRAFANA_PASSWORD=${{ secrets.GRAFANA_PASSWORD }}
            GRAFANA_CLICKHOUSE_PASSWORD=${{ secrets.CLICKHOUSE_PASSWORD }}
            NATS_PASSWORD_DOORMAN=${{ secrets.NATS_PASSWORD_DOORMAN }}
            NATS_PASSWORD_HERALD=${{ secrets.NATS_PASSWORD_HERALD }}
            NATS_PASSWORD_CAESAR=${{ secrets.NATS_PASSWORD_CAESAR }}
            NATS_PASSWORD_CHARON=${{ secrets.NATS_PASSWORD_CHARON }}
            NATS_PASSWORD_RIDDLER=${{ secrets.NATS_PASSWORD_RIDDLER }}
            NATS_PASSWORD_SPHINX=${{ secrets.NATS_PASSWORD_SPHINX }}
            ALERTMANAGER_TG_TOKEN=${{ secrets.ALERTMANAGER_TG_TOKEN }}
            ALERTMANAGER_TG_CHAT_ID=${{ secrets.ALERTMANAGER_TG_CHAT_ID }}
            JAEGER_BASIC_AUTH_HASH=${{ secrets.JAEGER_BASIC_AUTH_HASH }}
            FIREBASE_CREDENTIALS_JSON=${{ secrets.FIREBASE_CREDENTIALS_JSON }}
            ENVEOF
            sed -i 's/^[[:space:]]*//' .env

            printf 'JWT_RSA_PRIVATE_KEY=' >> .env
            printf '%s' '${{ secrets.JWT_RSA_PRIVATE_KEY }}' | awk 'NR>1{printf "\\n"}{printf "%s",$0}' >> .env
            echo >> .env

            export $(grep -E '^NATS_PASSWORD_' .env | xargs)
            envsubst '$NATS_PASSWORD_DOORMAN $NATS_PASSWORD_HERALD $NATS_PASSWORD_CAESAR $NATS_PASSWORD_CHARON $NATS_PASSWORD_RIDDLER $NATS_PASSWORD_SPHINX' \
              < /opt/edium/nats/nats-server.conf > /tmp/nats-expanded.conf
            mv /tmp/nats-expanded.conf /opt/edium/nats/nats-server.conf

            export $(grep -E '^ALERTMANAGER_' .env | xargs)
            envsubst '$ALERTMANAGER_TG_TOKEN $ALERTMANAGER_TG_CHAT_ID' \
              < /opt/edium/alertmanager/alertmanager.yml > /tmp/alertmanager-expanded.yml
            mv /tmp/alertmanager-expanded.yml /opt/edium/alertmanager/alertmanager.yml

            export JAEGER_BASIC_AUTH_HASH="$(grep '^JAEGER_BASIC_AUTH_HASH=' .env | cut -d= -f2-)"
            envsubst '$JAEGER_BASIC_AUTH_HASH' \
              < /opt/edium/Caddyfile > /tmp/Caddyfile-expanded
            mv /tmp/Caddyfile-expanded /opt/edium/Caddyfile

            echo '${{ secrets.YC_SA_KEY_JSON }}' | docker login --username json_key --password-stdin cr.yandex

            docker compose pull
            docker compose up -d nats
            docker compose restart nats
            for i in $(seq 1 15); do nc -z 127.0.0.1 4222 2>/dev/null && break; sleep 1; done
            docker compose up -d --remove-orphans
            docker compose restart grafana vector caddy alertmanager
            docker image prune -f

            for i in $(seq 1 30); do
              docker compose exec -T clickhouse clickhouse-client \
                --user vector --password "${{ secrets.CLICKHOUSE_PASSWORD }}" \
                --query "SELECT 1" > /dev/null 2>&1 && break
              sleep 2
            done

            docker compose exec -T clickhouse clickhouse-client \
              --user vector --password "${{ secrets.CLICKHOUSE_PASSWORD }}" \
              --database logs --multiquery < /opt/edium/clickhouse/init.sql

            docker compose exec -T clickhouse clickhouse-client \
              --user vector --password "${{ secrets.CLICKHOUSE_PASSWORD }}" \
              --database logs --multiquery < /opt/edium/clickhouse/migrate.sql

            rm -rf /tmp/edium-deploy
            echo "Prod deploy завершён"

      - name: Итог
        run: |
          echo "## Production Deploy" >> $GITHUB_STEP_SUMMARY
          echo "- **Коммит:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Статус:** Успешно" >> $GITHUB_STEP_SUMMARY
