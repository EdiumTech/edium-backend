name: Deploy Join Site API

on:
  workflow_dispatch:
    inputs:
      apply:
        description: "Применить проверенный план"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

env:
  TF_VERSION: "1.9"
  YC_MIRROR: "https://terraform-mirror.yandexcloud.net/"

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: infra/terraform/accounts/join-site
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Подготовка изолированной конфигурации
        run: |
          set -euo pipefail
          cat > ~/.terraformrc <<'EOF'
          provider_installation {
            network_mirror {
              url = "${{ env.YC_MIRROR }}"
              include = ["registry.terraform.io/*/*"]
            }
            direct {
              exclude = ["registry.terraform.io/*/*"]
            }
          }
          EOF
          printf '%s' '${{ secrets.YC_SA_KEY_JSON }}' > key.json
          printf '%s' '${{ secrets.TF_VARS_PLATFORM }}' > platform.tfvars
          grep -E '^[[:space:]]*(cloud_id|folder_id)[[:space:]]*=' platform.tfvars > terraform.tfvars
          test "$(wc -l < terraform.tfvars)" -eq 2
          INVOKER_SERVICE_ACCOUNT_ID="$(python3 -c 'import json; print(json.load(open("key.json"))["service_account_id"])')"
          printf 'invoker_service_account_id = "%s"\n' "$INVOKER_SERVICE_ACCOUNT_ID" >> terraform.tfvars
          cat >> terraform.tfvars <<'EOF'
          resume_bucket_name = "edium-team-applications"
          email_mode         = "herald"
          team_email         = "hr@edium.online"
          herald_api_key     = "${{ secrets.EMAIL_API_KEY }}"
          runner_image_url   = "${{ vars.JOIN_RUNNER_IMAGE_URL }}"
          EOF

      - name: Terraform init
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.TF_S3_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.TF_S3_SECRET_KEY }}
        run: terraform init

      - name: Terraform plan
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.TF_S3_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.TF_S3_SECRET_KEY }}
        run: terraform plan -no-color -out=tfplan

      - name: Terraform apply
        if: inputs.apply
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.TF_S3_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.TF_S3_SECRET_KEY }}
        run: |
          set -o pipefail
          terraform apply -parallelism=1 -auto-approve tfplan 2>&1 | tee terraform-apply.log
          if grep -q "Failed to create version for Yandex Cloud Function" terraform-apply.log; then
            echo "::error::Yandex provider did not publish a Cloud Function version"
            exit 1
          fi

      # The Yandex provider currently reports a failed Cloud Function version
      # creation as a warning, so `terraform apply` can exit successfully while
      # leaving a function without `$latest`. A serialized apply avoids the
      # API race between the API and maintenance versions; the second plan makes
      # any swallowed provider warning fail the deployment instead of producing
      # a misleading green workflow.
      - name: Проверка состояния после apply
        if: inputs.apply
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.TF_S3_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.TF_S3_SECRET_KEY }}
        run: |
          set +e
          terraform plan -parallelism=1 -detailed-exitcode -no-color -out=post-apply.tfplan
          verify_exit=$?
          set -e
          if [ "$verify_exit" -eq 2 ]; then
            echo "::error::Terraform оставил неприменённые изменения после apply"
            terraform show -no-color post-apply.tfplan
            exit 1
          fi
          exit "$verify_exit"

      - name: Результат
        if: inputs.apply
        run: |
          echo "## Join Site API" >> "$GITHUB_STEP_SUMMARY"
          echo "- **API:** $(terraform output -raw api_base_url)" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Runner:** $(terraform output -raw runner_url)" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Режим почты:** Herald" >> "$GITHUB_STEP_SUMMARY"

      - name: Очистка секретных файлов
        if: always()
        run: rm -f key.json platform.tfvars terraform.tfvars tfplan post-apply.tfplan terraform-apply.log function.zip
