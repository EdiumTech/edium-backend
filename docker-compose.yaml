name: edium

services:
  doorman:
    build:
      context: ./doorman
      dockerfile: Dockerfile
    restart: on-failure
    environment:
      POSTGRES_DSN: postgres://${DOORMAN_PG_USER}:${DOORMAN_PG_PWD}@doorman-db:5432/${DOORMAN_PG_DB}?sslmode=disable
      REDIS_URL: redis://:${DOORMAN_REDIS_PWD}@doorman-redis:6379/0
      NATS_URL: nats://doorman:${NATS_PASSWORD_DOORMAN}@nats:4222
      JWT_RSA_PRIVATE_KEY: ${JWT_RSA_PRIVATE_KEY}
      OTEL_ENDPOINT: jaeger:4317
    ports:
      - "8081:80"
    depends_on:
      doorman-db:
        condition: service_healthy
      doorman-redis:
        condition: service_healthy
      doorman-flyway:
        condition: service_completed_successfully
      nats:
        condition: service_started
      jaeger:
        condition: service_started

  doorman-db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DOORMAN_PG_USER}
      POSTGRES_PASSWORD: ${DOORMAN_PG_PWD}
      POSTGRES_DB: ${DOORMAN_PG_DB}
    ports:
      - "5433:5432"
    volumes:
      - doorman_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20

  doorman-flyway:
    image: flyway/flyway:latest
    restart: "no"
    command: ["migrate"]
    environment:
      - FLYWAY_URL=jdbc:postgresql://doorman-db:5432/${DOORMAN_PG_DB}
      - FLYWAY_USER=${DOORMAN_PG_USER}
      - FLYWAY_PASSWORD=${DOORMAN_PG_PWD}
      - FLYWAY_LOCATIONS=filesystem:/app/migrations
      - FLYWAY_VALIDATE_MIGRATION_NAMING=true
      - FLYWAY_BASELINE_ON_MIGRATE=true
    volumes:
      - ./doorman/migrations:/app/migrations
    depends_on:
      doorman-db:
        condition: service_healthy

  doorman-redis:
    image: redis:8
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${DOORMAN_REDIS_PWD}
    command: >
      sh -c 'exec redis-server --requirepass "$$REDIS_PASSWORD" --appendonly yes'
    ports:
      - "6380:6379"
    volumes:
      - doorman_redis_data:/data
    healthcheck:
      test: >
        sh -c 'redis-cli -a "$$REDIS_PASSWORD" ping | grep -q PONG'
      interval: 5s
      timeout: 3s
      retries: 20

  jaeger:
    image: jaegertracing/all-in-one:1.68.0
    restart: unless-stopped
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"
      - "4317:4317"

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data

  nats:
    image: nats:2.10
    restart: unless-stopped
    command: ["-c", "/etc/nats/nats-server.conf"]
    ports:
      - "4222:4222"
    environment:
      NATS_PASSWORD_DOORMAN: ${NATS_PASSWORD_DOORMAN}
      NATS_PASSWORD_HERALD: ${NATS_PASSWORD_HERALD}
      NATS_PASSWORD_CAESAR: ${NATS_PASSWORD_CAESAR}
      NATS_PASSWORD_CHARON: ${NATS_PASSWORD_CHARON}
      NATS_PASSWORD_RIDDLER: ${NATS_PASSWORD_RIDDLER}
      NATS_PASSWORD_SPHINX: ${NATS_PASSWORD_SPHINX}
    volumes:
      - nats_data:/data
      - ./infra/nats/nats-server.conf:/etc/nats/nats-server.conf:ro

  caesar:
    build:
      context: ./caesar
      dockerfile: Dockerfile
    restart: on-failure
    environment:
      POSTGRES_DSN: postgres://${CAESAR_PG_USER}:${CAESAR_PG_PWD}@caesar-db:5432/${CAESAR_PG_DB}?sslmode=disable
      NATS_URL: nats://caesar:${NATS_PASSWORD_CAESAR}@nats:4222
      DOORMAN_JWKS_URL: ${DOORMAN_JWKS_URL}
      OTEL_ENDPOINT: jaeger:4317
    ports:
      - "8082:80"
    depends_on:
      caesar-db:
        condition: service_healthy
      caesar-flyway:
        condition: service_completed_successfully
      doorman:
        condition: service_started
      nats:
        condition: service_started
      jaeger:
        condition: service_started

  caesar-db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${CAESAR_PG_USER}
      POSTGRES_PASSWORD: ${CAESAR_PG_PWD}
      POSTGRES_DB: ${CAESAR_PG_DB}
    ports:
      - "5436:5432"
    volumes:
      - caesar_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20

  caesar-flyway:
    image: flyway/flyway:latest
    restart: "no"
    command: ["migrate"]
    environment:
      - FLYWAY_URL=jdbc:postgresql://caesar-db:5432/${CAESAR_PG_DB}
      - FLYWAY_USER=${CAESAR_PG_USER}
      - FLYWAY_PASSWORD=${CAESAR_PG_PWD}
      - FLYWAY_LOCATIONS=filesystem:/app/migrations
      - FLYWAY_VALIDATE_MIGRATION_NAMING=true
      - FLYWAY_BASELINE_ON_MIGRATE=true
    volumes:
      - ./caesar/migrations:/app/migrations
    depends_on:
      caesar-db:
        condition: service_healthy

  tor:
    build:
      context: ./tor
      dockerfile: Dockerfile
    restart: unless-stopped

  herald:
    build:
      context: ./herald
      dockerfile: Dockerfile
    restart: on-failure
    environment:
      POSTGRES_DSN: postgres://${HERALD_PG_USER}:${HERALD_PG_PWD}@herald-db:5432/${HERALD_PG_DB}?sslmode=disable
      NATS_URL: nats://herald:${NATS_PASSWORD_HERALD}@nats:4222
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      EMAIL_API_KEY: ${EMAIL_API_KEY:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_TLS_MODE: ${SMTP_TLS_MODE:-starttls}
      SMS_API_KEY: ${SMS_API_KEY}
      SMS_ALLOWED_PHONES: ${SMS_ALLOWED_PHONES}
      SMS_BLOCKED_PHONES: ${SMS_BLOCKED_PHONES}
      DOORMAN_JWKS_URL: http://doorman/.well-known/jwks.json
      FIREBASE_CREDENTIALS_JSON: ${FIREBASE_CREDENTIALS_JSON}
      OTEL_ENDPOINT: jaeger:4317
      HTTPS_PROXY: socks5://tor:9050
      NO_PROXY: jaeger,doorman
    ports:
      - "8084:80"
    depends_on:
      jaeger:
        condition: service_started
      herald-db:
        condition: service_healthy
      herald-flyway:
        condition: service_completed_successfully
      nats:
        condition: service_started
      tor:
        condition: service_started
      doorman:
        condition: service_started

  herald-db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${HERALD_PG_USER}
      POSTGRES_PASSWORD: ${HERALD_PG_PWD}
      POSTGRES_DB: ${HERALD_PG_DB}
    ports:
      - "5434:5432"
    volumes:
      - herald_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20

  herald-flyway:
    image: flyway/flyway:latest
    restart: "no"
    command: ["migrate"]
    environment:
      - FLYWAY_URL=jdbc:postgresql://herald-db:5432/${HERALD_PG_DB}
      - FLYWAY_USER=${HERALD_PG_USER}
      - FLYWAY_PASSWORD=${HERALD_PG_PWD}
      - FLYWAY_LOCATIONS=filesystem:/app/migrations
      - FLYWAY_VALIDATE_MIGRATION_NAMING=true
      - FLYWAY_BASELINE_ON_MIGRATE=true
    volumes:
      - ./herald/migrations:/app/migrations
    depends_on:
      herald-db:
        condition: service_healthy

  charon:
    build:
      context: ./charon
      dockerfile: Dockerfile
    restart: on-failure
    environment:
      POSTGRES_DSN: postgres://${CHARON_PG_USER}:${CHARON_PG_PWD}@charon-db:5432/${CHARON_PG_DB}?sslmode=disable
      REDIS_URL: redis://:${CHARON_REDIS_PWD}@charon-redis:6379/0
      NATS_URL: nats://charon:${NATS_PASSWORD_CHARON}@nats:4222
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      OTEL_ENDPOINT: jaeger:4317
    ports:
      - "8083:80"
    depends_on:
      charon-db:
        condition: service_healthy
      charon-redis:
        condition: service_healthy
      charon-flyway:
        condition: service_completed_successfully
      nats:
        condition: service_started
      jaeger:
        condition: service_started

  charon-db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${CHARON_PG_USER}
      POSTGRES_PASSWORD: ${CHARON_PG_PWD}
      POSTGRES_DB: ${CHARON_PG_DB}
    ports:
      - "5435:5432"
    volumes:
      - charon_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20

  charon-flyway:
    image: flyway/flyway:latest
    restart: "no"
    command: ["migrate"]
    environment:
      - FLYWAY_URL=jdbc:postgresql://charon-db:5432/${CHARON_PG_DB}
      - FLYWAY_USER=${CHARON_PG_USER}
      - FLYWAY_PASSWORD=${CHARON_PG_PWD}
      - FLYWAY_LOCATIONS=filesystem:/app/migrations
      - FLYWAY_VALIDATE_MIGRATION_NAMING=true
      - FLYWAY_BASELINE_ON_MIGRATE=true
    volumes:
      - ./charon/migrations:/app/migrations
    depends_on:
      charon-db:
        condition: service_healthy

  charon-redis:
    image: redis:8
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${CHARON_REDIS_PWD}
    command: >
      sh -c 'exec redis-server --requirepass "$$REDIS_PASSWORD" --appendonly yes'
    ports:
      - "6381:6379"
    volumes:
      - charon_redis_data:/data
    healthcheck:
      test: >
        sh -c 'redis-cli -a "$$REDIS_PASSWORD" ping | grep -q PONG'
      interval: 5s
      timeout: 3s
      retries: 20

  riddler:
    build:
      context: ./riddler
      dockerfile: Dockerfile
    restart: on-failure
    environment:
      POSTGRES_DSN: postgres://${RIDDLER_PG_USER}:${RIDDLER_PG_PWD}@riddler-db:5432/${RIDDLER_PG_DB}?sslmode=disable
      REDIS_URL: redis://:${RIDDLER_REDIS_PWD}@riddler-redis:6379/0
      NATS_URL: nats://riddler:${NATS_PASSWORD_RIDDLER}@nats:4222
      DOORMAN_JWKS_URL: ${DOORMAN_JWKS_URL}
      OTEL_ENDPOINT: jaeger:4317
    ports:
      - "8085:80"
    depends_on:
      riddler-db:
        condition: service_healthy
      riddler-redis:
        condition: service_healthy
      riddler-flyway:
        condition: service_completed_successfully
      doorman:
        condition: service_started
      nats:
        condition: service_started
      jaeger:
        condition: service_started

  riddler-redis:
    image: redis:8
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${RIDDLER_REDIS_PWD}
    command: >
      sh -c 'exec redis-server --requirepass "$$REDIS_PASSWORD" --appendonly yes'
    ports:
      - "6384:6379"
    volumes:
      - riddler_redis_data:/data
    healthcheck:
      test: >
        sh -c 'redis-cli -a "$$REDIS_PASSWORD" ping | grep -q PONG'
      interval: 5s
      timeout: 3s
      retries: 20

  riddler-db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${RIDDLER_PG_USER}
      POSTGRES_PASSWORD: ${RIDDLER_PG_PWD}
      POSTGRES_DB: ${RIDDLER_PG_DB}
    ports:
      - "5437:5432"
    volumes:
      - riddler_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20

  riddler-flyway:
    image: flyway/flyway:latest
    restart: "no"
    command: ["migrate"]
    environment:
      - FLYWAY_URL=jdbc:postgresql://riddler-db:5432/${RIDDLER_PG_DB}
      - FLYWAY_USER=${RIDDLER_PG_USER}
      - FLYWAY_PASSWORD=${RIDDLER_PG_PWD}
      - FLYWAY_LOCATIONS=filesystem:/app/migrations
      - FLYWAY_VALIDATE_MIGRATION_NAMING=true
      - FLYWAY_BASELINE_ON_MIGRATE=true
    volumes:
      - ./riddler/migrations:/app/migrations
    depends_on:
      riddler-db:
        condition: service_healthy

  louvre:
    build:
      context: ./louvre
      dockerfile: Dockerfile
    restart: on-failure
    environment:
      POSTGRES_DSN: postgres://${LOUVRE_PG_USER}:${LOUVRE_PG_PWD}@louvre-db:5432/${LOUVRE_PG_DB}?sslmode=disable
      MINIO_ENDPOINT: minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET:-edium-images}
      MINIO_USE_SSL: ${MINIO_USE_SSL:-false}
      DOORMAN_JWKS_URL: ${DOORMAN_JWKS_URL}
      OTEL_ENDPOINT: jaeger:4317
    ports:
      - "8086:80"
    depends_on:
      louvre-db:
        condition: service_healthy
      louvre-flyway:
        condition: service_completed_successfully
      doorman:
        condition: service_started
      minio:
        condition: service_healthy
      jaeger:
        condition: service_started

  louvre-db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${LOUVRE_PG_USER}
      POSTGRES_PASSWORD: ${LOUVRE_PG_PWD}
      POSTGRES_DB: ${LOUVRE_PG_DB}
    ports:
      - "5438:5432"
    volumes:
      - louvre_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -D $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20

  louvre-flyway:
    image: flyway/flyway:latest
    restart: "no"
    command: ["migrate"]
    environment:
      - FLYWAY_URL=jdbc:postgresql://louvre-db:5432/${LOUVRE_PG_DB}
      - FLYWAY_USER=${LOUVRE_PG_USER}
      - FLYWAY_PASSWORD=${LOUVRE_PG_PWD}
      - FLYWAY_LOCATIONS=filesystem:/app/migrations
      - FLYWAY_VALIDATE_MIGRATION_NAMING=true
      - FLYWAY_BASELINE_ON_MIGRATE=true
    volumes:
      - ./louvre/migrations:/app/migrations
    depends_on:
      louvre-db:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v3.3.0
    restart: unless-stopped
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:11.6.1
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_INSTALL_PLUGINS: grafana-clickhouse-datasource
    volumes:
      - ./infra/grafana/datasources:/etc/grafana/provisioning/datasources:ro
      - ./infra/grafana/provisioning:/etc/grafana/provisioning/dashboards:ro
      - ./infra/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
      - jaeger

volumes:
  nats_data:
  doorman_db_data:
  doorman_redis_data:
  herald_db_data:
  charon_db_data:
  charon_redis_data:
  caesar_db_data:
  riddler_db_data:
  riddler_redis_data:
  minio_data:
  louvre_db_data:
  prometheus_data:
  grafana_data:
